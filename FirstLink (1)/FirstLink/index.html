<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login — JSU Mentoring</title>
  <link rel="stylesheet" href="./CSS/mentees/main.css">
  <link rel="stylesheet" href="./CSS/login.css">
</head>
<body>

  <div class="glow-blob blue"></div>

  <div class="card">

    <div class="brand">
      <img src="./Assets/Logo/uni.png" width="80" height="100" alt="UP logo"/>
      <h1>Welcome back</h1>
    </div>

    <div class="alert-box" id="alertBox" style="display:none;">
      Invalid email or password. Please try again.
    </div>

    <form id="loginForm" novalidate>

      <div class="field">
        <label for="email">Email address:</label>
        <input type="email" id="email" name="email"
          placeholder="you@example.com" autocomplete="email" required />
      </div>

      <div class="field">
        <label for="password">Password:</label>
        <input type="password" id="password" name="password"
          placeholder="••••••••" autocomplete="current-password" required />
        <button type="button" class="toggle-pw" id="togglePw">Show</button>
      </div>

      <div id="log">
        <button type="submit" class="btn-primary" id="loginBtn">Login</button>
      </div>
<br/>
<br/>
      <div id="create">
        <p class="signup-link">Don't have an account?</p>
        <button type="button" onclick="window.location.href='./Pages/Mentors/signup_page.html'">Mentor Signup</button>
        <button type="button" onclick="window.location.href='./Pages/Mentees/signup_page.html'">Mentee Signup</button>
      </div>

    </form>
  </div>

  <!-- Javascript folder is at ./Javascript/ relative to root index.html -->
  <script src="./Javascript/Authetication.js"></script>
  <script>
    document.getElementById('togglePw').addEventListener('click', () => {
      const pw  = document.getElementById('password');
      const btn = document.getElementById('togglePw');
      const hidden = pw.type === 'password';
      pw.type = hidden ? 'text' : 'password';
      btn.textContent = hidden ? 'Hide' : 'Show';
    });

    document.getElementById('loginForm').addEventListener('submit', (e) => {
      e.preventDefault();
      loginUser();
    });
  </script>

</body>
</html>
